{% extends 'base.html' %}

{% block content %}
<h1>All Users</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Profile</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td><a href="{% url 'profile' user.username %}">View Profile</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
