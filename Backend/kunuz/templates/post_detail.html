<h1>{{ post.title }}</h1>
<p>{{ post.content }}</p>

<h2>Add Comment</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Comment</button>
</form>

<hr>

<h2>Comments</h2>

{% for comment in comments %}
    {% include "comment_item.html" with comment=comment level=0 %}
{% empty %}
    <p>No comments yet.</p>
{% endfor %}
