services:
  mongodb:
    image: mongo:latest
    ports:
      - "2717:27017"
    volumes:
      - mongo-data:/data/db
      - ./db_dump/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh
      - ./db_dump/heritage_db:/docker-entrypoint-initdb.d/dump/heritage_db

  backend:
    build:
      context: ./Backend/heritage_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/heritage_backend:/app
    environment:
      - MONGODB_HOST=mongodb://mongodb:27017/heritage_db
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      - mongodb
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./Frontend/kunuz-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend/kunuz-app:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: npm run dev
    depends_on:
      - backend

volumes:
  mongo-data:
