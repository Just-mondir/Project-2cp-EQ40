

# REBUILD AFTER CODE CHANGES:
#   docker compose up --build --force-recreate
#
# RESET DATABASE (re-seed from dump):
#   docker compose down -v
#   docker compose up --build

services:
  # ── MongoDB with pre-loaded data ──────────────────────────────
  mongo:
    build: ./mongo-seed
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Django Backend ────────────────────────────────────────────
  backend:
    build: ./Backend/heritage_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/heritage_backend/.env.docker
    depends_on:
      mongo:
        condition: service_healthy

  # ── Next.js Frontend ──────────────────────────────────────────
  frontend:
    build: ./Frontend/kunuz-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
