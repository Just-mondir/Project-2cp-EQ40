<h1>Edit Post</h1>

<form method="POST">
  {% csrf_token %} {{ form.as_p }}
  <button type="submit">Save Post</button>
</form>

<hr />

<h2>Images</h2>

<div style="display: flex; gap: 12px; flex-wrap: wrap">
  {% for img in object.images.all %}
  <div style="border: 1px solid #ddd; padding: 8px">
    <img src="{{ img.image.url }}" style="max-width: 150px; display: block" />
    <form method="POST" action="{% url 'delete-image' img.id %}">
      {% csrf_token %}
      <button type="submit" style="margin-top: 6px">🗑 Remove</button>
    </form>
  </div>
  {% empty %}
  <p>No images yet.</p>
  {% endfor %}
</div>

<hr />

<h3>Add new images</h3>
<form
  method="POST"
  action="{% url 'add-images' object.id %}"
  enctype="multipart/form-data"
>
  {% csrf_token %}
  <input type="file" name="images" multiple />
  <button type="submit">Upload</button>
</form>
